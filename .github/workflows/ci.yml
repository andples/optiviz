name: ci
on:
  push:
  pull_request:

# read-only token; actions pinned to commits (docs/security.md)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Software Vulkan for the kernel tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release --exclude optiviz-gpu-test
      - run: cargo test -p optiviz-core --release --features parallel
      - name: Kernel tests (lavapipe)
        run: cargo test -p optiviz-gpu-test --release -- --nocapture
        env:
          OPTIVIZ_REQUIRE_GPU: "1"
          OPTIVIZ_PERF: "0"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: just,wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: just wasm
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: pnpm e2e
        working-directory: web
        env:
          ALL_BROWSERS: "1"
