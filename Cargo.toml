[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/bench", "crates/gpu-test"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
optiviz-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
